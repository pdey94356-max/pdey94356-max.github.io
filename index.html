<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Welcome - Puja Dey</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #5c1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .welcome-text {
            color: white;
            font-size: 4em;
            font-weight: bold;
            font-style: italic;
            position: absolute;
            text-align: center;
            white-space: nowrap;
        }
        .enter-btn {
            margin-top: 420px;
            padding: 12px 30px;
            background-color: transparent;
            border: 2px solid white;
            color: white;
            border-radius: 25px;
            font-size: 1em;
            text-decoration: none;
            opacity: 0;
            transition: background-color 0.2s;
        }
        .enter-btn.show {
            opacity: 1;
        }
        .enter-btn:hover {
            background-color: white;
            color: #5c1a1a;
        }
        .letter {
            opacity: 0;
            display: inline-block;
            animation: popIn 0.35s ease forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(15px) scale(0.7); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .fade-out {
            animation: fadeOut 0.6s ease forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="welcome-text" id="text"></div>
    <a href="index.html" class="enter-btn" id="enterBtn">Enter →</a>

   <script>
    const words = ["স্বাগতম", "Welcome", "Willkommen", "स्वागतम्"];
    const textEl = document.getElementById("text");
    const enterBtn = document.getElementById("enterBtn");
    let wordIndex = 0;

    function splitGraphemes(str) {
        if (typeof Intl !== "undefined" && Intl.Segmenter) {
            const seg = new Intl.Segmenter('bn', { granularity: 'grapheme' });
            return Array.from(seg.segment(str), s => s.segment);
        }
        return Array.from(str);
    }

    function typeWord(word, callback) {
        textEl.innerHTML = "";
        const chars = splitGraphemes(word);
        let i = 0;
        function addLetter() {
            if (i < chars.length) {
                const span = document.createElement("span");
                span.className = "letter";
                span.textContent = chars[i];
                textEl.appendChild(span);
                i++;
                setTimeout(addLetter, 90);
            } else {
                setTimeout(callback, 900);
            }
        }
        addLetter();
    }

    function showNextWord() {
        if (wordIndex < words.length) {
            typeWord(words[wordIndex], function() {
                textEl.classList.add("fade-out");
                setTimeout(function() {
                    textEl.classList.remove("fade-out");
                    wordIndex++;
                    showNextWord();
                }, 600);
            });
        } else {
            enterBtn.classList.add("show");
            setTimeout(function() {
                window.location.href = "index.html";
            }, 1800);
        }
    }

    showNextWord();
</script>
</body>
</html>
